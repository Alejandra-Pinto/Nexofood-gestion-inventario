<div class="layout">
  <!-- ===================== MENÚ LATERAL ===================== -->
  <aside class="sidebar">
    <!-- Logo (frontend/public/logo-chori.png) y nombre del negocio -->
    <div class="marca-box">
      <img class="logo" src="logo-chori.png" alt="Logo Chori Company" />
      <strong class="marca">Chori Company</strong>
    </div>

    <!-- Opciones del menú: las que no tienen ruta se muestran deshabilitadas -->
    <nav class="menu">
      @for (op of menu; track op.texto) {
        @if (op.ruta) {
          <a class="menu-item" [routerLink]="op.ruta" routerLinkActive="activo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="op.icono" /></svg>
            {{ op.texto }}
          </a>
        } @else {
          <span class="menu-item deshabilitado" title="Disponible en próximos sprints">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="op.icono" /></svg>
            {{ op.texto }}
          </span>
        }
      }
    </nav>

    <!-- Usuario en sesión (se conectará con el módulo Auth en HU-1.1) -->
    <div class="usuario">
      <span class="avatar">A</span>
      <div>
        <strong>Administrador</strong>
        <small>Chori Company</small>
      </div>
    </div>
  </aside>

  <!-- ===================== CONTENIDO ===================== -->
  <!-- Aquí Angular muestra la pantalla según la ruta (ej: /productos) -->
  <main class="contenido">
    <router-outlet />
  </main>
</div>
